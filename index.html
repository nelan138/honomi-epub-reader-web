<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="./styles/bookshelf.css">
   <title>Honomi — Bookshelf</title>
</head>

<body>
   <main id="bookshelf">
      <header class="bookshelf-header">
         <input id="epub-file-input" type="file" accept=".epub,application/epub+zip" hidden>

         <button type="button" id="import-book-btn">Import</button>
         <button type="button" id="edit-bookshelf-btn">Edit</button>
         <button type="button" id="toggle-setting-btn">Settings</button>
      </header>

      <section class="category">
         <h2>Categories are like this</h2>

         <div class="book-card-list">
            <article class="book-card">
               <div class="cover-wrapper">
                  <img src="./tests/images/majo_no_tabitabi_2.jpg" alt="Cover of 魔女の旅々２ (GAノベル)">
               </div>
               <div class="metadata">
                  <h3 class="title">魔女の旅々２ (GAノベル)</h3>
                  <p class="creator">by 白石 定規</p>
                  <p class="language">ja</p>
               </div>
               <div class="progress-bar">0%</div>
            </article>

            <!-- More book-cards here -->
         </div>
      </section>

      <!-- More categories here -->
   </main>

   <script type="module" src="./src/main.js"></script>
</body>

</html>
