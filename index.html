<!doctype html>
<html class="themed-scroll scrollbar-thin" lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />

      <title>Honomi — Bookshelf</title>

      <style>
         /* Firefox */
         .themed-scroll {
            scrollbar-width: thin;
            scrollbar-color: var(--color-muted) transparent;
         }

         /* Chrome, Edge, Safari */
         .themed-scroll::-webkit-scrollbar {
            width: 6px;
         }

         .themed-scroll::-webkit-scrollbar-track {
            background: transparent;
         }

         .themed-scroll::-webkit-scrollbar-thumb {
            background-color: var(--color-muted); /* Updated to match Firefox */
            border-radius: 9999px;
         }
      </style>
   </head>

   <body
      class="min-h-dvh max-w-dvw bg-(--background) font-sans text-base leading-normal font-normal text-(--ink) md:text-xl lg:text-base"
   >
      <main id="app"></main>

      <div data-role="portals">
         <div id="loading-screen"></div>
         <div id="toast"></div>
         <div id="prompt-dialog"></div>
         <div id="alert-dialog"></div>
         <div id="select-dialog"></div>
      </div>

      <script type="module" src="./src/main.ts"></script>
   </body>
</html>
