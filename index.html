<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="./styles/bookshelf.css">
   <link rel="stylesheet" href="./styles/forms.css">
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

   <title>Honomi — Bookshelf</title>
</head>

<body>
   <header class="bookshelf-header">
      <div class="primary-actions">
         <input id="epub-file-input" type="file" accept=".epub,application/epub+zip" multiple hidden>
         <button type="button" id="import-book-btn">
            <i class="fa-solid fa-upload"></i>
         </button>
      </div>

      <div class="more-actions">
         <button type="button" id="find-book-btn">
            <i class="fa-solid fa-magnifying-glass"></i>
         </button>

         <button type="button" id="sort-books-btn">
            <i class="fa-solid fa-sort"></i>
         </button>

         <button type="button" id="add-category-btn">
            <i class="fa-solid fa-folder-plus"></i>
         </button>

         <button type="button" id="toggle-theme-btn">
            <i class="fa-solid fa-circle-half-stroke"></i>
         </button>

         <button type="button" id="toggle-settings-btn">
            <i class="fa-solid fa-gear"></i>
         </button>
      </div>
   </header>
   
   <main id="bookshelf"></main>

   <script type="module" src="./src/main.js"></script>
</body>

</html>
