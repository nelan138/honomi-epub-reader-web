<!doctype html>
<html lang="en" class="scrollbar-none">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
      <title>Honomi — Bookshelf</title>
   </head>

   <body class="bg-bg text-ink min-h-dvh font-serif text-xs leading-normal font-normal md:text-base">
      <header class="bookshelf-header bg-surface sticky top-0 z-100 flex w-full items-center p-4 text-base md:text-lg">
         <div class="mx-auto flex w-full items-center justify-between md:max-w-8/10">
            <div class="primary-actions flex gap-6 md:gap-8">
               <input id="epub-file-input" type="file" accept=".epub,application/epub+zip" multiple hidden />

               <button
                  type="button"
                  id="import-book-btn"
                  class="text-accent hover:text-accent-hover hover:cursor-pointer"
               >
                  <i class="fa-solid fa-upload"></i>
               </button>

               <button type="button" id="open-github-repo-btn" class="hover:text-accent-hover hover:cursor-pointer hidden md:block">
                  <i class="fa-brands fa-github"></i>
               </button>
            </div>

            <div class="more-actions flex gap-6 md:gap-8">
               <button type="button" id="find-book-btn" class="hover:text-accent-hover hover:cursor-pointer">
                  <i class="fa-solid fa-magnifying-glass"></i>
               </button>

               <button type="button" id="sort-books-btn" class="hover:text-accent-hover hover:cursor-pointer">
                  <i class="fa-solid fa-sort"></i>
               </button>

               <button type="button" id="add-category-btn" class="hover:text-accent-hover hover:cursor-pointer">
                  <i class="fa-solid fa-folder-plus"></i>
               </button>

               <button type="button" id="toggle-theme-btn" class="hover:text-accent-hover hover:cursor-pointer">
                  <i class="fa-solid fa-circle-half-stroke"></i>
               </button>

               <button type="button" id="toggle-settings-btn" class="hover:text-accent-hover hover:cursor-pointer">
                  <i class="fa-solid fa-gear"></i>
               </button>
            </div>
         </div>
      </header>

      <main class="mx-auto flex min-h-full w-full flex-col gap-4 md:max-w-8/10" id="bookshelf">
         <!-- Categories go here -->
      </main>

      <!-- Category -->
      <template id="category-template">
         <section class="category p-4" data-category-name="">
            <header class="category-header flex py-2 justify-between">
               <h2 class="font-label text-ink/80 flex w-full items-center font-medium tracking-widest uppercase"></h2>

               <div class="category-actions flex gap-4 md:gap-8">
                  <button
                     type="button"
                     class="move-category-up-btn hover:text-accent-hover hover:cursor-pointer"
                     data-action="move-up"
                  >
                     <i class="fa-solid fa-circle-up"></i>
                  </button>

                  <button
                     type="button"
                     class="move-category-down-btn hover:text-accent-hover hover:cursor-pointer"
                     data-action="move-down"
                  >
                     <i class="fa-solid fa-circle-down"></i>
                  </button>

                  <button
                     type="button"
                     class="rename-category-btn hover:text-accent-hover hover:cursor-pointer"
                     data-action="rename"
                  >
                     <i class="fa-solid fa-pencil"></i>
                  </button>

                  <button
                     type="button"
                     class="collapse-category-btn hover:text-accent-hover hover:cursor-pointer"
                     data-action="collapse"
                  >
                     <i class="fa-solid fa-caret-down"></i>
                  </button>

                  <button
                     type="button"
                     class="expand-category-btn hover:text-accent-hover hover:cursor-pointer"
                     data-action="expand"
                  >
                     <i class="fa-solid fa-caret-right"></i>
                  </button>

                  <button
                     type="button"
                     class="delete-category-btn hover:text-accent-hover hover:cursor-pointer"
                     data-action="delete"
                  >
                     <i class="fa-solid fa-x"></i>
                  </button>
               </div>
            </header>

            <div class="book-card-list grid grid-cols-1 gap-4 auto-rows-50 md:auto-rows-54">
               <!-- Book cards go here -->
            </div>
         </section>
      </template>

      <!-- Book card -->
      <template id="book-card-template">
         <article
            class="group book-card bg-surface grid w-full grid-cols-[2fr_3fr] md:grid-cols-[1fr_3fr] gap-4 rounded-sm p-2 text-base"
            data-book-id=""
         >
            <div class="cover-wrapper bg-surface flex h-full w-full items-center overflow-hidden rounded-sm">
               <img class="h-auto w-full" src="" alt="Cover" />
            </div>

            <div class="bg-surface flex flex-col gap-2 md:gap-4">
               <div class="metadata flex flex-1 flex-col md:gap-2">
                  <h3 class="title font-label line-clamp-4 text-lg font-medium md:text-xl"></h3>
                  <p class="creator text-muted"></p>
                  <p class="language text-muted uppercase"></p>
               </div>

               <div class="progress-bar bg-accent h-1"></div>

               <div class="book-card-actions flex justify-around p-2 md:justify-start md:gap-8">
                  <button type="button" class="rename-book-btn" data-action="rename">
                     <i class="fa-solid fa-pen-to-square"></i>
                  </button>

                  <button type="button" class="change-book-category-btn" data-action="change-category">
                     <i class="fa-solid fa-right-left"></i>
                  </button>

                  <button type="button" class="delete-book-btn" data-action="delete">
                     <i class="fa-solid fa-trash"></i>
                  </button>
               </div>
            </div>
         </article>
      </template>

      <script type="module" src="./src/main.js"></script>
   </body>
</html>
